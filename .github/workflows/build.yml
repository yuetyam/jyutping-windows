name: Build

on:
  push:
    branches: [ master, develop ]
    paths:
      - '.gitattributes'
      - 'Jyutping/**'
      - 'JyutpingUpdater/**'
      - 'Shared/**'
      - 'third_party/WinSparkle/**'
      - 'Version.targets'
      - 'version.txt'
      - 'packaging/**'
      - 'tests/**'
      - 'preparing/**'
      - 'Jyutping.sln'
      - '.github/workflows/**'
  pull_request:
    branches: [ master, develop ]
    paths:
      - '.gitattributes'
      - 'Jyutping/**'
      - 'JyutpingUpdater/**'
      - 'Shared/**'
      - 'third_party/WinSparkle/**'
      - 'Version.targets'
      - 'version.txt'
      - 'packaging/**'
      - 'tests/**'
      - 'preparing/**'
      - 'Jyutping.sln'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test_update_release:
    name: Update release tooling tests
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Test signing and feed generation with temporary keys
      shell: pwsh
      run: ./tests/Test-UpdateRelease.ps1 -CreateFixtures

  build_preparing:
    name: Build Preparing
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build Preparing
      run: cargo build --locked
      working-directory: ./preparing

  test_preparing:
    name: Preparing Tests
    needs: [ build_preparing ]
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Test Preparing
      run: cargo test --locked
      working-directory: ./preparing

  run_preparing:
    name: Run Preparing
    needs: [ test_preparing ]
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Prepare database
      shell: pwsh
      run: |
        $outputPath = Join-Path $env:RUNNER_TEMP 'ime.sqlite3'
        cargo run --locked --release -- $outputPath
        if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf) -or (Get-Item -LiteralPath $outputPath).Length -eq 0) {
          throw 'Preparing did not produce a non-empty database.'
        }
      working-directory: ./preparing

    - name: Upload database
      uses: actions/upload-artifact@v7
      with:
        name: core-ime-database
        path: ${{ runner.temp }}\ime.sqlite3
        if-no-files-found: error
        retention-days: 1

  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    needs: [ run_preparing ]
    strategy:
      matrix:
        configuration: [ Debug, Release ]
        platform: [ Win32, x64, ARM64, ARM64EC ]
      fail-fast: false

    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download database
      uses: actions/download-artifact@v8
      with:
        name: core-ime-database
        path: Jyutping/Resources

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
        vs-version: '[18.0,19.0)'

    - name: Build solution
      run: msbuild Jyutping.sln -m -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:PreferredToolArchitecture=x64 -v:minimal

    - name: Archive updater
      if: matrix.platform == 'x64' || matrix.platform == 'ARM64'
      uses: actions/upload-artifact@v7
      with:
        name: updater-${{ matrix.platform }}-${{ matrix.configuration }}
        path: JyutpingUpdater/bin/${{ matrix.platform }}/${{ matrix.configuration }}/
        if-no-files-found: error
