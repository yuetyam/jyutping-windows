name: Build

on:
  push:
    branches: [ master, develop ]
    paths:
      - '.gitattributes'
      - 'Jyutping/**'
      - 'JyutpingUpdater/**'
      - 'JyutpingSettings/**'
      - 'backend/**'
      - 'Shared/**'
      - 'third_party/WinSparkle/**'
      - 'Version.targets'
      - 'version.txt'
      - 'packaging/**'
      - 'tests/**'
      - 'preparing/**'
      - 'Jyutping.sln'
      - '.github/workflows/**'
  pull_request:
    branches: [ master, develop ]
    paths:
      - '.gitattributes'
      - 'Jyutping/**'
      - 'JyutpingUpdater/**'
      - 'JyutpingSettings/**'
      - 'backend/**'
      - 'Shared/**'
      - 'third_party/WinSparkle/**'
      - 'Version.targets'
      - 'version.txt'
      - 'packaging/**'
      - 'tests/**'
      - 'preparing/**'
      - 'Jyutping.sln'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test_update_release:
    name: Update release tooling tests
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Test signing and feed generation with temporary keys
      shell: pwsh
      run: ./tests/Test-UpdateRelease.ps1 -CreateFixtures

  build_preparing:
    name: Build Preparing
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build Preparing
      run: cargo build --locked
      working-directory: ./preparing

  test_preparing:
    name: Preparing Tests
    needs: [ build_preparing ]
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Test Preparing
      run: cargo test --locked
      working-directory: ./preparing

  run_preparing:
    name: Run Preparing
    needs: [ test_preparing ]
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Prepare database
      shell: pwsh
      run: |
        $outputPath = Join-Path $env:RUNNER_TEMP 'ime.sqlite3'
        cargo run --locked --release -- $outputPath
        if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf) -or (Get-Item -LiteralPath $outputPath).Length -eq 0) {
          throw 'Preparing did not produce a non-empty database.'
        }
      working-directory: ./preparing

    - name: Upload database
      uses: actions/upload-artifact@v7
      with:
        name: core-ime-database
        path: ${{ runner.temp }}\ime.sqlite3
        if-no-files-found: error
        retention-days: 1

  test_backend:
    name: Backend and settings
    needs: [ run_preparing ]
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: core-ime-database
        path: Jyutping/Resources
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Test Rust engine, RPC, and build WinUI
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $installation = & $vswhere -latest -version '[18.0,19.0)' -property installationPath
        Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $installation -DevCmdArguments '-arch=x64 -host_arch=x64' -SkipAutomaticLocation
        cargo test --locked --offline --manifest-path backend/Cargo.toml --workspace
        ./backend/tests/Test-WindowsEngineParity.ps1
        cargo build --locked --offline --manifest-path backend/Cargo.toml
        New-Item -ItemType Directory -Force backend/target/smoke-x64 | Out-Null
        Push-Location backend/target/smoke-x64
        try {
            midl /nologo /robust /env x64 /prefix client Client_ /prefix server Server_ ../../../Shared/Protocol/JyutpingRpc.idl
            cl /nologo /W4 /MT /std:c++20 /EHsc /I. /FeRpcSmoke.exe ../../tests/RpcSmoke.cpp ../../../Jyutping/BackendRpcClient.cpp JyutpingRpc_c.c
        } finally {
            Pop-Location
        }
        ./backend/tests/Test-Rpc.ps1 -ServerPath backend/target/debug/JyutpingServer.exe -ClientPath backend/target/smoke-x64/RpcSmoke.exe
        $settingsPublish = Join-Path $env:RUNNER_TEMP 'JyutpingSettings'
        dotnet publish JyutpingSettings/JyutpingSettings.csproj -r win-x64 -c Release -o $settingsPublish
        foreach ($resource in @('JyutpingSettings.pri', 'App.xbf')) {
            if (!(Test-Path -LiteralPath (Join-Path $settingsPublish $resource) -PathType Leaf)) {
                throw "Published Settings is missing $resource"
            }
        }
        msbuild Jyutping.sln -m -p:Configuration=Debug -p:Platform=ARM64EC -p:EnableBackendClient=true -p:PreferredToolArchitecture=x64 -v:minimal

  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    needs: [ run_preparing ]
    strategy:
      matrix:
        configuration: [ Debug, Release ]
        platform: [ Win32, x64, ARM64, ARM64EC ]
      fail-fast: false

    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download database
      uses: actions/download-artifact@v8
      with:
        name: core-ime-database
        path: Jyutping/Resources

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
        vs-version: '[18.0,19.0)'

    - name: Build solution
      run: msbuild Jyutping.sln -m -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:PreferredToolArchitecture=x64 -v:minimal

    - name: Archive updater
      if: matrix.platform == 'x64' || matrix.platform == 'ARM64'
      uses: actions/upload-artifact@v7
      with:
        name: updater-${{ matrix.platform }}-${{ matrix.configuration }}
        path: JyutpingUpdater/bin/${{ matrix.platform }}/${{ matrix.configuration }}/
        if-no-files-found: error
